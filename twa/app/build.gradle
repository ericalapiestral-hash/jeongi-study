plugins {
    id 'com.android.application'
}

android {
    namespace 'app.jeongi.study'
    compileSdk 34

    defaultConfig {
        applicationId 'app.jeongi.study'
        minSdk 21
        targetSdk 34
        versionCode (project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 1)
        versionName (project.hasProperty('appVersionName') ? project.appVersionName : '1.0')
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: '../keystore.jks')
            storePassword System.getenv('KS_PASS') ?: 'jeongi2026'
            keyAlias System.getenv('KEY_ALIAS') ?: 'jeongi'
            keyPassword System.getenv('KS_PASS') ?: 'jeongi2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
